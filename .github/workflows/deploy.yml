name: Deploy to GitHub Pages

# One workflow, three triggers, and each one is load bearing:
#
#   push          — the ordinary path: land on main, gate, deploy.
#   pull_request  — the gate must judge PRs too, or Dependabot opens bumps with
#                   no CI signal on any of them (§6.1).
#   workflow_dispatch — a merge performed with secrets.GITHUB_TOKEN raises NO
#                   push event; GitHub suppresses them so workflows cannot
#                   retrigger themselves. Without this trigger an auto-merged
#                   bump would land on main and the live site would keep
#                   serving the previous build, with no red run anywhere to say
#                   so (§6.2). It is also the by-hand re-run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # NOT a bare `pages`: with cancel-in-progress, a pull-request run would
  # cancel a live deploy of main.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The WHOLE suite gates the deploy, not just the a11y half. A 2026-08-14
      # sweep found 29 repos running `test:a11y` alone, so their unit and
      # algorithmic suites never blocked a publish -- those repos could ship a
      # build whose cryptography was broken so long as the browser specs passed.
      - name: Unit tests (Vitest, incl. spec KATs and the pinned vectors)
        run: npm test

      - name: Build (typecheck gates the build)
        run: npm run build

      # NEVER `--with-deps`. That apt step wedged 547 CI runs across this fleet.
      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Accessibility gate (axe-core, WCAG 2.1 A/AA)
        run: npm run test:a11y

      - name: Claims suite (does the page tell the truth)
        run: npm run test:claims

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    # NOT `== 'push'`. That would also skip workflow_dispatch, which is the one
    # trigger §6.2 depends on: the dispatched run would build, pass the gate,
    # and skip the deploy job, so the site would still never update.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Dependabot only. `needs: build` is the whole safety argument -- the gate
  # decides, not the version number. A major that actually breaks this lab
  # fails the gate and the pull request stays open for a human.
  dependabot-auto-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required by the deploy dispatch below. Without it `gh workflow run`
      # returns HTTP 403 "Resource not accessible by integration", the merged
      # bump never deploys, and a `|| echo` fallback hides it.
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Merge any bump whose gate went green
        # Retry: a sibling pull request merging first moves main underneath us
        # and GitHub rejects with "Base branch was modified". That is benign, so
        # try again rather than failing the run over a race.
        #
        # `merged=1` is load bearing: it is set only in the branch the `gh pr
        # merge` command's own exit status selects, and the Deploy step below
        # guards on it as `env.merged`. Nothing downstream re-asks the API
        # whether the merge landed, so do not "simplify" this echo away.
        run: |
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              echo "merged=1" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          echo "::warning::gate passed but the merge did not land after 3 attempts;"
          echo "::warning::leaving this PR open - Dependabot will rebase and retry."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A merge made with GITHUB_TOKEN raises no push event, so `deploy` would
      # never run and the site would keep serving the previous build. Ask for it
      # explicitly; a workflow_dispatch through the API is not suppressed. The
      # dispatched run is the same gate-then-deploy pipeline, so a bad merge
      # still ships nothing.
      #
      # The guard is `env.merged` -- the flag the step above writes to
      # $GITHUB_ENV from the exit status of the `gh pr merge` that actually did
      # the merging. $GITHUB_ENV is the right mechanism here and only here: a
      # value written to it is visible to LATER steps, never the current one,
      # and the merge is the prior step.
      #
      # What is deliberately NOT here is a second API query asking whether the
      # pull request we just merged reached the MERGED state. That question can
      # fail -- rate limit, transient 5xx, a token that lost scope, a PR object
      # not yet consistent -- and when it does the pipeline emits nothing,
      # `grep -q` matches nothing, the `if` takes the else branch, and the step
      # exits 0 having dispatched nothing and printed nothing. Not even a
      # warning, because the `|| echo` guarded a `gh workflow run` that was
      # never reached. The merge's own exit status cannot fail to be observed,
      # so it is what decides.
      #
      # `shell: bash` does not fix that shape: inside an `if` condition a failing
      # pipeline takes the else branch with or without pipefail, and `set -e` is
      # exempt in that position.
      - name: Deploy the merged result
        if: success() && env.merged == '1'
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
